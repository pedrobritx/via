name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # O build roda sem nenhum segredo. Se algum dia falhar por falta de
      # variável de ambiente, é sinal de que o fallback offline quebrou — e
      # isso é justamente o que este passo existe para pegar.
      - name: Build
        run: npm run build
